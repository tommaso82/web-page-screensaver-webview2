name: Remove merged branches

on:
  push:
    branches: [master]
    paths: ['.github/workflows/cleanup-merged-branches.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            docs/readme-refresh-20261025 \
            fix/center-settings-title \
            fix/urgent-stability-20261025 \
            fix/windows-release-1.3.0
          do
            ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${branch}" --jq '.ahead_by')
            if [ "$ahead" != 0 ]; then
              echo "::error::Branch $branch contains $ahead unmerged commits; refusing deletion."
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged branch: $branch"
          done
